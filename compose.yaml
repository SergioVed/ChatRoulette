services:
  backend:
    build: ./backend
    ports:
      - '9000:9000'

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'

  db:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
